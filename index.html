<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Приглашение на свадьбу</title>
  <link rel="stylesheet" href="index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="invitation-wrapper">
    <header class="invitation-header">
      <div class="floral-divider"></div>
      <h1 class="main-title">Приглашение</h1>
      <div class="floral-divider"></div>
    </header>
    <p><br /></p>
    <!--<div><img src="фотоКириллРебенок.jpg" width="235" height="300"></div>-->
    <div><img src="фотоКириллРебенок.jpg" width="413" height="338"></div>
    <div class="gift-plus"><i>+</i></div>
    <div><img src="фотоДашаРебенок.jpg" width="365" height="330"></div>
    <div class="main-title">
        <p>Д + К = <3</p>
    </div>
    <div class="announcement">
      <p>МЫ ВЫРОСЛИ,</p>
      <p>И ТЕПЕРЬ НАМ МОЖНО</p>
    </div>

    <div class="date-section">
      <div class="date-decoration left"></div>
      <time datetime="2026-08-22" class="date-value">22 августа 2026</time>
      <div class="date-decoration right"></div>
    </div>

    <div class="countdown">
      <div class="countdown-item">
        <span class="countdown-number">16</span>
        <span class="countdown-label">недель</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number">05</span>
        <span class="countdown-label">дней</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number">03</span>
        <span class="countdown-label">часов</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number">05</span>
        <span class="countdown-label">минут</span>
      </div>
      <div class="countdown-item">
        <span class="countdown-number">57</span>
        <span class="countdown-label">секунд</span>
      </div>
    </div>

    <footer class="invitation-footer">
      <p>Мы ждём вас!</p>
    </footer>
  </div>
</body>
</html>
